[platformio]
default_envs = nodemcuv2

; Shared by every ESP8266 board below.
[esp_base]
platform = espressif8266@4.2.1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
extra_scripts =
    pre:tools/version.py
    pre:tools/embed_dashboard.py
; AsyncMqttClient-esphome pulls in its own copy of ESPAsyncTCP; we already have
; esp32async/ESPAsyncTCP for the web server, and two copies must not be linked.
; (The original marvinroger/AsyncMqttClient was dropped: OutPacket::qos() reads
; the wrong byte, so QoS 0 packets still queued when a connection drops are
; resent with the DUP flag and brokers disconnect us in a loop.)
lib_ignore = ESPAsyncTCP-esphome
build_flags =
    -Wall
lib_deps =
    esp32async/ESPAsyncWebServer@3.12.1
    esp32async/ESPAsyncTCP@2.0.0
    bblanchon/ArduinoJson@7.4.3
    heman/AsyncMqttClient-esphome@2.1.0

[env:nodemcuv2]
extends = esp_base
board = nodemcuv2

[env:d1_mini]
extends = esp_base
board = d1_mini

[env:esp12e]
extends = esp_base
board = esp12e

; Host-side unit tests for the detection algorithm (no hardware needed):
;   pio test -e native
[env:native]
platform = native
test_framework = unity
lib_deps =
    bblanchon/ArduinoJson@7.4.3
build_flags =
    -std=c++17
    -Wall -Wextra
