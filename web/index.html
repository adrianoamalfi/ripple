<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Inline icon: the board only serves this one file, so /favicon.* would 404. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none' stroke='%232a8a9b' stroke-width='1.8'%3E%3Ccircle cx='16' cy='16' r='3.2' fill='%232a8a9b' stroke='none'/%3E%3Ccircle cx='16' cy='16' r='7.6' opacity='.8'/%3E%3Ccircle cx='16' cy='16' r='12.6' opacity='.42'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Ripple</title>
    <script>
      // Apply the saved / system theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("theme");
        var dark =
          t === "dark" ||
          ((t === null || t === "system") &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(dark ? "dark" : "light");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
