name: Release

# Push a tag like v0.2.0 to publish a release: the three firmware images, their
# checksums, and release notes taken from CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: write       # to start the Pages workflow once the release exists

jobs:
  verify:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$(cat VERSION)" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($(cat VERSION)). Update VERSION first."
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.env }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        env: [nodemcuv2, d1_mini, esp12e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the dashboard from source
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - run: pip install platformio
      - name: Build the firmware
        env:
          RIPPLE_VERSION: ${{ needs.verify.outputs.version }}
        run: pio run -e ${{ matrix.env }}
      - name: Name the image
        run: cp .pio/build/${{ matrix.env }}/firmware.bin "ripple-${{ matrix.env }}-${GITHUB_REF_NAME}.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: ripple-*.bin

  publish:
    name: Publish the release
    needs: [verify, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum ripple-*.bin > SHA256SUMS && cat SHA256SUMS
      - name: Release notes
        run: |
          {
            .github/scripts/changelog-notes.sh "${{ needs.verify.outputs.version }}"
            echo
            echo "## Install"
            echo
            echo "Flash from your browser with the [web installer](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/install/),"
            echo "or write \`ripple-<board>-${GITHUB_REF_NAME}.bin\` at offset \`0x0\` with esptool."
            echo "Check the files against \`SHA256SUMS\`. Pick the image for your board: \`nodemcuv2\`, \`d1_mini\` or \`esp12e\`."
          } > notes.md
      - name: Create the release
        run: |
          # Versions below 1.0 are pre-releases.
          flag=""
          case "${{ needs.verify.outputs.version }}" in 0.*|*-*) flag="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Ripple $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag $flag
      - name: Update the website's installer
        run: gh workflow run pages.yml --ref main
