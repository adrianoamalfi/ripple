name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Never paste your WiFi or MQTT passwords.**
  - type: input
    id: version
    attributes:
      label: Firmware version
      description: Shown in the dashboard header and on the Device card.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: board
    attributes:
      label: Board
      options: [NodeMCU, Wemos / LOLIN D1 mini, Generic ESP-12E/F, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: log
    attributes:
      label: Serial log
      description: At 115200 baud. Especially useful if the board restarts (look for `Reset reason:`).
      render: text
